server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's built-in DNS; re-resolve so nginx can start before the backend exists
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $backend http://backend:5000;
    proxy_pass $backend;            # no URI part: /v1/... is forwarded unchanged
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  
    # The service worker file must never be cached, or updates won't reach users.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  # Hashed build files can be cached for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    try_files $uri /index.html;
  }
}
