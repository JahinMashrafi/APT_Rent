<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22344E"/>
      <stop offset="55%" stop-color="#1B2A41"/>
      <stop offset="100%" stop-color="#121E30"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#C89B3C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C89B3C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="900" rx="900" ry="260" fill="url(#glow)"/>

  <!-- far skyline: apartment blocks, low opacity for depth -->
  <g fill="#0F1826" opacity="0.55">
    <rect x="40" y="560" width="120" height="240"/>
    <rect x="170" y="500" width="90" height="300"/>
    <rect x="270" y="600" width="140" height="200"/>
    <rect x="1180" y="520" width="110" height="280"/>
    <rect x="1300" y="580" width="150" height="220"/>
    <rect x="1460" y="480" width="100" height="320"/>
  </g>

  <!-- mid skyline: gabled houses -->
  <g fill="#16233A" opacity="0.8">
    <path d="M60 800 V680 L180 610 L300 680 V800 Z"/>
    <path d="M320 800 V700 L410 645 L500 700 V800 Z"/>
    <path d="M1120 800 V690 L1220 625 L1320 690 V800 Z"/>
    <path d="M1340 800 V710 L1420 660 L1500 710 V800 Z"/>
  </g>

  <!-- foreground row: the "home" silhouettes with roofline + tiny windows -->
  <g fill="#1B2A41">
    <path d="M420 800 V620 L560 520 L700 620 V800 Z"/>
    <path d="M700 800 V660 L790 600 L880 660 V800 Z"/>
    <path d="M880 800 V600 L1020 500 L1160 600 V800 Z"/>
  </g>

  <!-- brass window accents -->
  <g fill="#C89B3C" opacity="0.9">
    <rect x="470" y="660" width="26" height="26"/>
    <rect x="520" y="660" width="26" height="26"/>
    <rect x="470" y="710" width="26" height="26"/>
    <rect x="520" y="710" width="26" height="26"/>
    <rect x="600" y="660" width="26" height="26"/>
    <rect x="600" y="710" width="26" height="26"/>
    <rect x="930" y="640" width="24" height="24"/>
    <rect x="980" y="640" width="24" height="24"/>
    <rect x="1060" y="640" width="24" height="24"/>
    <rect x="930" y="690" width="24" height="24"/>
    <rect x="980" y="690" width="24" height="24"/>
    <rect x="1060" y="690" width="24" height="24"/>
    <rect x="750" y="700" width="20" height="20"/>
    <rect x="805" y="700" width="20" height="20"/>
  </g>

  <!-- ground line -->
  <rect x="0" y="800" width="1600" height="100" fill="#0F1826"/>
</svg>
