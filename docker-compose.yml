services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: "5000"
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "5000:5000"
    # Add explicit DNS servers to bypass Docker's internal resolver block
    dns:
      - 8.8.8.8
      - 1.1.1.1

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend
